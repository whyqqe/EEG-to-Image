# Dual-channel Stage-3: freeze bridge; train BIT residual. Full epochs, no early stop.
output_dir: outputs/atm_distill_s3_sub08

atm:
  subject: sub-08
  bridge_dir: outputs/atm_bridge
  dim: 1024
  use_bit: true
  freeze_atm_semantics: true
  refiner:
    enabled: false
  bridge:
    in_dim: 1024
    brain_dim: 1024
    num_brain_tokens: 128
    num_eeg_tokens: 8
    hidden: 2048
    dropout: 0.1

bit:
  brain_dim: 1024
  num_brain_tokens: 128
  num_query_tokens: 256
  num_blocks: 2
  num_heads: 8
  clip_dim: 1664
  vgg_dim: 512
  inject_eeg_as: kv
  checkpoint: checkpoints/brain_it/decoder_clipg_state_dict.pt

teacher_bank:
  size: 512

train:
  stage: 3
  loss_on: bit_clip
  early_stop_metric: test_top1_bit_clip
  min_distill_cos: 0.98
  early_stopping_patience: 0
  init_checkpoint: outputs/atm_distill_s1_sub08/checkpoints/atm_stage1_best.pt
  epochs: 20
  batch_size: 128
  learning_rate: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 4
  eval_every: 1

loss:
  lambda_clip: 0.05
  lambda_nce: 0.1
  lambda_distill: 2.0
  lambda_siglip: 0.0
  temperature: 0.07
  lambda_reg: 1.0e-4
  use_proxy_fallback: false
