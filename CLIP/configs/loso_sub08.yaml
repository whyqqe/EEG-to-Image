# LOSO fold with sub-08 held out.
#
# Why sub-08 and not another fold: it is the only fold with a publicly comparable
# cell -- SAMGA re-measured under the final-epoch protocol gives 28.7 / 59.5, and the
# SCORE-remeasured encoder baseline is 26.22 / 57.98 Top-1/Top-5 (plan doc §8). A
# number from this fold can be subtracted from a published one; a number from a
# different fold cannot.
base: default.yaml

target_subject: 8
source_subjects: [1, 2, 3, 4, 5, 6, 7, 9, 10]
out_dir: outputs/stage1/sub-08

seed: 2025
epochs: 50               # = schedule.stage1_epochs 20 + Stage 2 30 (matches the
                         # reference's released 50-epoch budget)
channel_set: all63
mvnn: train
