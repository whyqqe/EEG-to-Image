# v4 "Subject-as-Modality" recipe. This file is SELF-CONTAINED (no `base:`) on purpose:
# it is the specification of a redesign, and a reader must be able to see every value
# without chasing an inheritance chain. `default.yaml` remains the v3 recipe so every
# recorded result stays reproducible -- use `configs/loso_sub08_v4.yaml` for a fold.
#
# Justification for each value, and the measurement behind it, is in
# `docs/eeg2image_v4_architecture.md`. The three components that are NOT config values
# (share_head, SMN, the four-term objective) are selected by `arch`/`objective` below.

# --------------------------------------------------------------------- topology
arch: v4                # v3 | v4. v4 = ONE shared linear head for both modalities
                        # (kills the cross-cloud displacement by construction, §2.5) +
                        # the SMN (removes the residual per-subject offset, §3.4).
objective: v4           # v3 | v4. v4 = 4 terms: L_mmd (EEG cloud <-> image cloud),
                        # L_img, L_xs, L_spec. See `train.LossWeights`.
d_latent: 64            # per-modality pre-projection width, feeding `share_head`
d_align: 64             # the alignment space. 64, not 512: the concept manifold is
                        # measured at ~16 dimensions, and a 512-d space lets InfoNCE
                        # separate training classes in ~496 non-generalising
                        # subject-specific directions (§1.1, §3.5).
d_embed: 64             # UNUSED on arch v4 (kept equal to d_align so any reader that
                        # only knows `d_embed` still gets the right width)
share_head_hidden: 0    # C1, DEMOTED TO AN ABLATION ARM. `0` = a single shared LINEAR map.
                        #
                        # `128` (the nonlinear variant) is kept as a live arm because the
                        # 2x2 below was one seed, but it is no longer the default, because
                        # the evidence says it buys nothing:
                        #
                        #   arch/head              C2 on (SMN)        C2 off
                        #   hidden=128 (C1 real)   raw 17.5, cen +2.0  raw 12.5, cen +6.0
                        #   hidden=0   (C1 inert)  raw 19.5, cen -1.0  raw 17.0, cen +4.5
                        #
                        # The `cen` column (gain from an explicit query re-centring, i.e.
                        # the residual D1 the architecture failed to remove) depends ONLY
                        # on the C2 switch -- ~0 when SMN is on, +4.5...6.0 when it is off --
                        # and is unchanged by C1. So the D1 credit is 100% C2 and 0% C1; the
                        # nonlinear head is also the WORSE raw arm in both columns it
                        # appears in. That is what theory predicted: a linear shared head is
                        # an exact reparameterisation that `img_pre` can absorb (8.3e-07
                        # relative residual), so the sharing constrains nothing -- and
                        # "the constraint is real" was never the same claim as "the
                        # constraint is useful". See docs/eeg2image_v5_plan.md §1.5.
                        #
                        # Keep the note below: it is still the reason the `128` arm is
                        # RUNNABLE rather than a no-op, and the smoke test asserts it.
                        # THE NONLINEARITY IS THE WHOLE MECHANISM OF THAT ARM, not a detail:
                        # with a LINEAR shared head the sharing is an exact
                        # reparameterisation (`img_pre` is `linear`, so the two compose to
                        # one linear map, and img_pre = W^+ M realises any effective map M
                        # the image branch wants while W stays whatever the EEG branch
                        # prefers -- measured, 8.3e-07 relative residual).
                        # the shared map the same construction leaves 0.75 residual.
                        # `0` restores the bare Linear as an explicit ablation arm.
smn:
  enabled: true         # the per-subject mean subtraction, inside the forward pass
  gate_scale: true      # the per-direction rescale, behind a gate initialised at 0 --
                        # at 0 the module is EXACTLY centring, and it opens only if the
                        # objective pays for it. The covariance half of `saw_whiten` is
                        # measured at -0.5..+4.0 points across three seeds, so making it
                        # unconditional would be fitting one seed (§3.4).
  init_gate: 0.0
  min_rows: 4           # a group of 1 row subtracts itself and yields a zero vector;
                        # below this floor rows are passed through untouched

n_channels: 63          # inter-subject protocol uses all 63 (PROTOCOL_INTER.md §1)
n_timepoints: 250
n_subjects: 9           # overwritten by load_loso with the fold's real count
d_model: 200
n_heads: 4
n_blocks: 2
dim_ff: 512
dropout: 0.5            # the reference's encoder Dropout(0.5) (§3.9). Ours was 0.1; the
                        # aug-capacity failure mode (source-side separability destroyed
                        # by heavy augmentation) is not what dropout does, and the
                        # reference's regularisation budget lives here rather than in
                        # input augmentation.
head_dropout: 0.1
agg_width: 16
agg_pool: 8
img_head: linear        # the modality-private pre-projection, NOT the shared head
eeg_head: mlp
vicreg_cov_weight: 0.04 # UNUSED on v4 (which forbids `reg` -- see the `loss_weights`
                        # block); kept because it is the v3 covariance weight and the v3
                        # path is what every recorded result was produced with
target_fusion: routed
target_subject_dropout: 0.3
router_temperature: 2.0
router_layer_dropout: 0.1

image:
  feature_set: internvit_multilevel
  layers: [20, 24, 28, 32, 36]   # InternViT-6B intermediate layers (SAMGA's layout)
  l2norm: true

# -------------------------------------------------------------------- objective
# Weights here are RATIOS between terms. The phase coefficients come from `schedule`
# below and multiply them (see `Trainer.assemble`), which is how the reference's
# two-term objective `w_mmd*MMD + (1-w_mmd)*InfoNCE` is expressed in a four-term loss.
loss_weights:
  img: 1.0        # EEG <-> structured multi-layer image target
  cross: 0.7      # same stimulus, different subjects, multi-positive InfoNCE. The only
                  # alignment-preserving term with a positive measured effect.
  mmd: 1.0        # EEG cloud <-> image cloud (reference's `mmd_rbf`, §3.6)
  spec: 0.0       # OFF. This shipped at 0.05 and should not have. The term is
                  # `sum_{j>r0} lam_j / sum_j lam_j` and eigenvalues are ascending, so it
                  # IS the tail fraction -- but tail = 1 - head, so MINIMISING the tail is
                  # MAXIMISING the head, whose optimum is a rank-1 representation. It
                  # cannot tell rank 1 from rank 16: measured ~1e-07 at both, while the
                  # trained v4 checkpoint came back at effective rank 6.5 against v3.2's
                  # 14.4 on the same fold with `spec_top` pinned at 0.999 from epoch 8.
                  #
                  # Then the ablation settled it: removing the term changed Top-1 by
                  # -0.00pp (paired, 3 seeds, p = 1.00) and moved effective rank 6.5 -> 6.7.
                  # It was INERT, not harmful -- so the fix is to leave it at 0, not to
                  # tune it. The mathematically correct replacement is `spec_mode: rank`
                  # (bilateral effective-rank target, interior optimum); it is off until
                  # measured. See docs/eeg2image_v5_plan.md §3.4-D3 and §1.5.
  reg: 0.0        # REMOVED. The covariance decorrelation measures 4.6e-09 on this
                  # topology and moves by only 14% between a random representation and
                  # one with an axis EXACTLY duplicated, so any weight on it is
                  # decoration. `objective: v4` rejects a non-zero value; `L_spec` asks
                  # for the attainable version of the same request (§3.5).
  dec: 0.0        # REMOVED. Suppressing subject identity does not help on its own and
                  # hurts when pushed; `objective: v4` rejects a non-zero value.
  proto: 0.0      # REMOVED. No measured gain, and the anchor direction is unverified
                  # under the new metric.
  rkd: 0.0        # REMOVED (was already an ablation). Evidence came from LLM distillation.
  adv: 0.0        # REMOVED. An aggressive decorrelator removes signal.
  router: 0.05    # negative-entropy bonus on the layer blend; the blend was measured
                  # collapsing onto one layer without it
spec_r0: 16       # the measured dimension of the concept manifold, not a tuned constant
spec_mode: rank   # 'rank' | 'tail'. Which form `spec > 0` would use. 'tail' is the
                  # historical `spectral_concentration` and is PATHOLOGICAL (its global
                  # optimum is rank-1 collapse; see the `spec` comment above and
                  # `losses.regularizers.spectral_concentration`). 'rank' is the corrected
                  # bilateral target. Inert while `spec: 0`, but the default is `rank` so
                  # that turning the weight on cannot silently restore the broken form.
keep_last_epochs: 2  # cap on `epochNNN.pt` files kept per run. Was unbounded (one per
                     # epoch, ~190 MB/run, 16 GB accumulated) and -- worse than the space
                     # -- it made a scancelled PARTIAL run indistinguishable from a
                     # finished one, because both had a full epoch ladder AND a `last.pt`.

temp_img: 0.07
temp_cross: 0.10

# ------------------------------------------------------- recovery-aware (v5 pillar A)
# Train the fine contrasts in the metric the score is PRODUCED in, instead of raw cosine.
# Post-hoc calibration is exhausted on this representation -- the whole coordinate family
# (whitening, SAW, adaptive CSLS, learned maps, and the label-ORACLE diagonal reweighting)
# was measured at or BELOW plain centring -- so if CSLS is going to help at all, the
# encoder has to be optimised under it. This is SCORE's "recovery-aware training", which is
# where its 26.22 -> 53.23 comes from (the same frozen encoder, a different objective).
#
# `enabled: false` is bit-identical to every recorded run: `assemble` takes no branch.
recovery_aware:
  enabled: false        # OFF until measured. Turn on for G1b.
  block_per_subject: true
                        # Score `img` one subject at a time. LOAD-BEARING, not cosmetic:
                        # CSLS's neighbourhood density is a property of the RETRIEVAL SET,
                        # and deployment always scores ONE subject's queries against the
                        # gallery (`calibration.csls_scores`). A mixed 3-subject batch has a
                        # density no deployment ever sees, so correcting it optimises the
                        # encoder for the wrong density -- the exact failure this term
                        # exists to prevent.
  csls_k: 10            # 10 matches `calibration.csls_scores`'s default. `null` = block
                        # only, no hubness correction (a separate arm, so that blocking and
                        # CSLS can be attributed independently).
  terms: [img, cross]   # which fine contrasts are scored in the recovered metric. `mmd`
                        # is excluded on purpose: it is a distribution match with no logits
                        # to correct.
temp_proto: 0.07   # unused (proto is off) but the criterion is constructed regardless
softplus: true
prototype_level: concept
mmd_kernel: linear # unused on `objective: v4` (the v3 subject-MMD is what it configures)

# --------------------------------------------------------------------- schedule
# The reference's own ramp, `inter.sh`: --stage1_mmd_start 0.9 --stage1_mmd_end 0.5.
# The two coefficients are a convex split on v4 (they sum to 1), so `cross` ramps from
# 1-0.9=0.1 to 1-0.5=0.5, and Stage 2 is contrast-only at full weight.
schedule:
  coarse_to_fine: true
  stage1_epochs: 20       # must be < epochs, else there is no Stage 2
  mmd_start: 0.9
  mmd_end: 0.5
  stage2_mmd: 0.0         # "stage 2 contrastive only" (the reference's own choice)
  cross_start: 0.1
  cross_end: 0.5
  stage2_cross: 1.0       # Stage 2 runs the fine terms at full weight; without this it
                          # would inherit `cross_end` (0.5) and the phase boundary would
                          # halve the objective for no reason
  stage2_lr: 5.0e-05      # the reference's stage2_learning_rate
  freeze_encoder_stage2: false
                          # REVERSED FROM `true`, and this was one of the two real causes
                          # of the v4 regression. Freezing the trunk left the encoder with
                          # a 20-epoch budget at lr 1e-4 -- one fifth of the v3 recipe's
                          # (50 epochs, and 1e-3 for the first 20). Every seed was still
                          # improving on test when Stage 1 ended, and the frozen Stage 2
                          # then oscillated inside +-2 points for 30 epochs without a trend.
                          # That is the signature of under-training, not of a phase
                          # boundary "giving progress back".
                          #
                          # The measured cost of the two wrong values together (lr 1e-4 AND
                          # this freeze): +4.00pp, per-seed +4.0/+4.0/+4.0 across all three
                          # seeds against v3.2-base -- the only result in this round
                          # consistent across every seed. The dip-then-recover curve the
                          # `true` setting was justified by belongs to v3's objective, not
                          # to this one.
                          #
                          # Kept as a config key, and `true` remains a legal ablation: on a
                          # representation already in the deployed metric, joint Stage 2
                          # could in principle push it back out. It just did not, here.

epochs: 50
lr: 0.001               # WAS 1e-4, taken from the reference's LEARNING_RATE. That was a
                        # mistake: the reference trains a different backbone for a
                        # different epoch count, and copying its lr while ALSO freezing the
                        # trunk for 30 of 50 epochs left the encoder under-trained. 1e-3 is
                        # the v3 recipe's own value and the measured-correct one here:
                        # dropping back to it (together with un-freezing, above) was worth
                        # +4.00pp across all three seeds. See §1.5 of the v5 plan.
weight_decay: 0.0001
grad_clip: 1.0

# ----------------------------------------------------------------------- batching
batch_stimuli: 128         # distinct stimuli (concepts) per batch
subjects_per_stimulus: 3   # 3 x 128 = 384 rows/batch -> ~128 rows per subject, which is
                           # what makes the batch estimate of `mu_s` comparable to the
                           # 200-query estimate deployment uses
images_per_pair: 1
num_workers: 4
eval_batch: 200
log_every: 50
seed: 2025
debug_steps: null

# ------------------------------------------------------------------------- protocol
target_subject: 8
source_subjects: [1, 2, 3, 4, 5, 6, 7, 9, 10]
channel_set: all63
mvnn: train             # off | train  (sources on train split, target on test split)

# The DEPLOYED calibration choice. This block is documentation: the eval stage prints the
# whole ladder regardless (`scripts/run_eval.py`), and which rung is quoted is a reporting
# decision, not a config one. It is recorded here so "what did v4 claim as its number"
# is answerable from the config.
calibration:
  center: true          # the measured largest single lever (+6.5/+4.5/+2.5 on v3)
  whiten: false         # kept OFF by default: the covariance half is worth at most ~1
                        # point and is negative on 2 of 3 seeds
  csls: true            # optional hubness correction on top
  recovery: false       # SCORE-style post-hoc recovery measured to LOSE points on this
                        # representation (29 -> 28); the 53.23 in the literature comes
                        # from recovery-AWARE TRAINING, not post-hoc recovery
  csls_k: 10
  rho: 0.1
