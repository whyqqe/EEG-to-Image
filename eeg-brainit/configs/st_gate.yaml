# ST-GATE: Subject-Transport & Geometry Adaptation from EEG Profiles
# THINGS-EEG2 leave-one-subject-out, 200-way CLIP retrieval
#
# M = unlabeled same-subject background EEG → profile p_s
# K = labeled pairs to refine low-rank transport only (geometry stays label-free)
# Does not overwrite subject_align / prior experiment outputs.

protocol: leave_one_subject_out
dataset: THINGS-EEG2
gallery: outputs/atm_bridge/clip_img_test_1024.npy
method: ST-GATE

backbone: atm_style
nz: 256
profile_dim: 128
rank: 16
epochs: 25
max_per_sub: 0
batch_size: 128
lr: 3.0e-4
lambda_nce: 0.5
lambda_atm: 0.2
lambda_adv: 0.1
lambda_geo: 0.25
grl_max: 1.0
ctx_m: 32
null_profile_p: 0.25
m_list: [0, 50, 100]
k_list: [0, 1, 5, 10, 20]
adapt_lr: 5.0e-4
adapt_steps: 100
seed: 42

ablations_planned:
  - full (transport + geometry + adv)
  - transport_only (lambda_geo=0)
  - geometry_null (null profile / no hyper geo)
  - enigma_ws_baseline (compare subject_align v4)
