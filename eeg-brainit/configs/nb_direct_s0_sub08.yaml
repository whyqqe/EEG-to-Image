# Ablation A: NeuroBOLT → direct MLP → CLIP (residual ATM), no BIT.
output_dir: outputs/nb_direct_s0_sub08

neurobolt:
  subject: sub-08
  bridge_dir: outputs/atm_bridge
  neurobolt_dir: /project/peilab/why/cache/things_eeg2_b2/neurobolt
  clip_dim: 1024
  use_bit: false
  direct:
    enabled: true
    hidden: 1024
  bridge:
    fmri_dim: 512
    brain_dim: 1024
    num_brain_tokens: 128
    num_eeg_tokens: 8
    num_heads: 8
    hidden: 1024
    dropout: 0.1

bit:
  brain_dim: 1024
  num_brain_tokens: 128
  num_query_tokens: 256
  num_blocks: 2
  num_heads: 8
  clip_dim: 1664
  vgg_dim: 512
  inject_eeg_as: kv
  checkpoint: checkpoints/brain_it/decoder_clipg_state_dict.pt

teacher_bank:
  size: 512

train:
  stage: 0
  loss_on: direct_clip
  early_stop_metric: test_top1_direct_clip
  min_distill_cos: 0.98
  early_stopping_patience: 0
  init_checkpoint: ""
  epochs: 30
  batch_size: 512
  learning_rate: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 4
  eval_every: 1

loss:
  lambda_clip: 0.05
  lambda_nce: 0.1
  lambda_distill: 3.0
  lambda_siglip: 0.0
  temperature: 0.07
  lambda_reg: 0.0
  use_proxy_fallback: false
