# Dual-channel Stage-1: residual ATM skip; NO distill-maximizing early stop.
# Select best by test Top-1 under distill floor. patience=0 => run all epochs.
output_dir: outputs/atm_distill_s1_sub08

atm:
  subject: sub-08
  bridge_dir: outputs/atm_bridge
  dim: 1024
  use_bit: false
  freeze_atm_semantics: true
  refiner:
    enabled: false
  bridge:
    in_dim: 1024
    brain_dim: 1024
    num_brain_tokens: 128
    num_eeg_tokens: 8
    hidden: 2048
    dropout: 0.1

bit:
  brain_dim: 1024
  num_brain_tokens: 128
  num_query_tokens: 256
  num_blocks: 2
  num_heads: 8
  clip_dim: 1664
  vgg_dim: 512
  inject_eeg_as: kv
  checkpoint: checkpoints/brain_it/decoder_clipg_state_dict.pt

teacher_bank:
  size: 512

train:
  stage: 1
  loss_on: bridge_clip
  early_stop_metric: test_top1_bridge_clip
  min_distill_cos: 0.98
  early_stopping_patience: 0
  init_checkpoint: ""
  epochs: 30
  batch_size: 512
  learning_rate: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 4
  eval_every: 1

loss:
  lambda_clip: 0.05
  lambda_nce: 0.1
  lambda_distill: 3.0
  lambda_siglip: 0.0
  temperature: 0.07
  lambda_reg: 1.0e-4
  use_proxy_fallback: false
