# CLIP teacher alignment fine-tune (resume from Stage4).
output_dir: outputs/clip_align

data:
  teacher_dir: data/processed/teachers/clip_ViT-L-14_openai

clip_align:
  enabled: true
  in_dim: 1664
  out_dim: 768

train:
  stage: 2
  epochs: 15
  batch_size: 8
  grad_accum_steps: 2
  learning_rate: 1.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 4
  early_stopping_patience: 8
  max_val_batches: 20

loss:
  lambda_clip: 1.0
  lambda_nce: 0.5
  temperature: 0.07
  lambda_vgg: 0.0
  lambda_pixel: 0.0
  lambda_reg: 1.0e-4
  use_proxy_fallback: false
