# Phase-4: THINGS EEG–fMRI CLIP alignment (scaffold).
output_dir: outputs/things_align/run1

data:
  eeg_bridge_dir: outputs/atm_bridge
  # TODO: set after THINGS-fMRI is staged under data/ or cache/
  fmri_feat_dir: null
  clip_img_train: outputs/atm_bridge/clip_img_train_1024.npy
  subjects: [sub-08]

train:
  epochs: 30
  batch_size: 512
  learning_rate: 3.0e-4

loss:
  lambda_e2i: 1.0
  lambda_f2i: 1.0
  lambda_e2f: 0.5
