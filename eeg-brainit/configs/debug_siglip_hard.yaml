output_dir: outputs/siglip_hard_debug

data:
  teacher_dir: data/processed/teachers/clip_ViT-L-14_openai

clip_align:
  enabled: true
  in_dim: 1664
  out_dim: 768

teacher_bank:
  size: 128
  pool: 512
  hard_negatives: true

train:
  stage: 2
  epochs: 1
  batch_size: 16
  grad_accum_steps: 1
  learning_rate: 5.0e-5
  head_lr_mult: 5.0
  num_workers: 2
  max_steps: 50
  max_val_batches: 4
  early_stopping_patience: 99
  select_by_cos_gap: true

loss:
  lambda_clip: 0.1
  lambda_nce: 0.0
  lambda_siglip: 1.0
  lambda_vf: 0.0
  learnable_logit_scale: true
  init_logit_scale: 2.6592
  lambda_reg: 1.0e-4
  use_proxy_fallback: false
