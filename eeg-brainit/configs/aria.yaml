# ARIA: Anchor-Relative Inter-brain Alignment
protocol: leave_one_subject_out
dataset: THINGS-EEG2
method: ARIA

model:
  backbone: atm_style_shared   # no per-subject W_s in main path
  nz: 256
  clip_dim: 1024
  anchor_k: 512

train:
  epochs: 30
  warmup_epochs: 2
  max_per_sub: 0
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  amp: true
  temp: 0.07
  lambda_rsa: 1.0      # main: second-order geometry
  lambda_rel: 0.5      # relative InfoNCE
  lambda_abs: 0.1      # weak subject-centered absolute
  lambda_id: 0.1       # GRL identity
  lambda_atm: 0.2
  grl_max: 1.0

eval:
  settings:
    - absolute
    - relative
    - procrustes_n0
    - procrustes_n100
    - procrustes_n500
    - procrustes_n_all
  compare_to: [subject_align_loso_v3/v4, atm_ceiling]

notes:
  - Does not overwrite subject_align / pop_former / st_gate
  - P0 diagnostic: scripts/diagnose_aria_geometry.py
